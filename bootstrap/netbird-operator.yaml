apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird-operator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/netbirdio/helm-charts
      chart: netbird-operator
      targetRevision: 0.9.0
      helm:
        releaseName: netbird-operator
        valueFiles:
          - $values/platform/netbird-operator/values.yaml
    - repoURL: https://github.com/servik01/k8s-lab-apps.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: netbird
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
