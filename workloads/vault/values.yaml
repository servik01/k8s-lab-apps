vault:
  server:
    dev:
      enabled: false
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            telemetry {
              unauthenticated_metrics_access = true
            }
          }
          storage "raft" {
            path = "/vault/data"
          }
          service_registration "kubernetes" {}
          telemetry {
            prometheus_retention_time = "60s"
            disable_hostname = true
          }
      disruptionBudget:
        enabled: false
    dataStorage:
      enabled: true
      size: 2Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    tolerations: |
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  injector:
    enabled: true
  ui:
    enabled: true
  serverTelemetry:
    serviceMonitor:
      enabled: true
      selectors:
        release: monitoring
