apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-web
  template:
    metadata:
      labels:
        app: mesh-web
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/proxy-cpu-request: 10m
        config.linkerd.io/proxy-memory-request: 32Mi
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: mesh-web
  ports:
    - name: http
      port: 80
      targetPort: http
