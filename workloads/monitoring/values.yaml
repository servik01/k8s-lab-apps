kube-prometheus-stack:
  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 1
      nodeSelector:
        kubernetes.io/hostname: kubernetes
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi

  grafana:
    replicas: 1
    nodeSelector:
      kubernetes.io/hostname: k8s-worker
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    persistence:
      enabled: true
      existingClaim: grafana-worker-data
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: selfsigned-issuer
      hosts:
        - grafana.lab.local
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.lab.local

  prometheus:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: selfsigned-issuer
      hosts:
        - prometheus.lab.local
      tls:
        - secretName: prometheus-tls
          hosts:
            - prometheus.lab.local
    prometheusSpec:
      retention: 7d
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 100m
          memory: 400Mi
        limits:
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

  prometheusOperator:
    admissionWebhooks:
      certManager:
        enabled: true
      patch:
        enabled: false

  # метрики control-plane открыты через extraArgs в kubeadm-config (platform/kubeadm/config.yaml)
  kubeControllerManager:
    enabled: true
    serviceMonitor:
      https: true
      insecureSkipVerify: true   # самоподписанный сертификат
  kubeScheduler:
    enabled: true
    serviceMonitor:
      https: true
      insecureSkipVerify: true
  kubeEtcd:
    enabled: true                # HTTP на 2381, без аутентификации
  kubeProxy:
    enabled: false               # kube-proxy нет, его роль у Cilium

  # самоподписанный сертификат kubelet (как и в случае metrics-server)
  kubelet:
    serviceMonitor:
      insecureSkipVerify: true
