apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-demo
  template:
    metadata:
      labels:
        app: vault-demo
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "demo"
        vault.hashicorp.com/agent-inject-secret-config.txt: "secret/data/demo/config"
        vault.hashicorp.com/agent-inject-template-config.txt: |
          {{- with secret "secret/data/demo/config" -}}
          username={{ .Data.data.username }}
          password={{ .Data.data.password }}
          {{- end }}
    spec:
      serviceAccountName: vault-demo
      containers:
        - name: app
          image: busybox:1.37
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
