apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird-operator-vault-auth
  namespace: netbird
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-operator
  namespace: netbird
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: netbird-operator
          serviceAccountRef:
            name: netbird-operator-vault-auth
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-key
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-operator
    kind: SecretStore
  target:
    name: netbird-mgmt-api-key
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: NB_API_KEY
      remoteRef:
        key: netbird-operator
        property: api_key
