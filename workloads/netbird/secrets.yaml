apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird-vault-auth
  namespace: netbird
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: netbird
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: netbird
          serviceAccountRef:
            name: netbird-vault-auth
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-setup-key
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: netbird-setup-key
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: NB_SETUP_KEY
      remoteRef:
        key: netbird
        property: setup_key
