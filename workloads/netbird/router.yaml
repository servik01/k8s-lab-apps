apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-router-config
  namespace: netbird
data:
  NB_DISABLE_CLIENT_ROUTES: "true"
---
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: lab
  namespace: netbird
spec:
  dnsZoneRef:
    name: k8s.lab.internal
  workloadOverride:
    replicas: 1
    podTemplate:
      spec:
        containers:
          - name: netbird
            # envFrom avoids the operator 0.9.0 env merge conflict with NB_SETUP_KEY.
            envFrom:
              - configMapRef:
                  name: netbird-router-config
        nodeSelector:
          kubernetes.io/hostname: k8s-worker
