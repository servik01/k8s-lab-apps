apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: lab
  namespace: netbird
spec:
  dnsZoneRef:
    name: k8s.lab.internal
  workloadOverride:
    replicas: 1
    podTemplate:
      spec:
        containers:
          - name: netbird
            env:
              # Keep Kubernetes traffic local instead of using an Exit Node.
              - name: NB_DISABLE_CLIENT_ROUTES
                value: "true"
        nodeSelector:
          kubernetes.io/hostname: k8s-worker
